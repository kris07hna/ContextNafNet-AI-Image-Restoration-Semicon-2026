[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semicon-restore"
version = "0.1.0"
description = "Grayscale semiconductor inspection image restoration"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6.0,<7", "tqdm>=4.66,<5"]

[project.optional-dependencies]
train = ["scikit-image>=0.22,<1", "lpips>=0.1.4,<1", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]
